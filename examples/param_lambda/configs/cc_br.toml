# 2D curved channel, Brownian, staple test run test_cc_br (2000 cycles; the production run is not on this machine).
# q_np: NPNEq fit made by `run.py fit-qnp cc_br` (load_tis_data_cupy.py, same loader arguments).
name = "cc_br"
seed = 0

[data]
tis_dir = "/mnt/0bf0c339-34bb-4500-a5fb-f3c2a863de29/DATA/PyRETIS3/toytis/simulations/test_cc_br"
loader_args = ["--reversed"]
q_np = "examples/figures_by_potential/2d_curved_channel/brownian_g10/param_lambda/cc_br/qnp/committor.npz"
qnp_fit_args = ["--max-iter", "4000", "--lazy-basis", "--gamma", "0.1"]
cv_names = ["y", "x"]
state_cv = 0
exact = "cc"                        # exact_tools grid of the discrete chain (cc_exact.py)
exact_file = "examples/figures_by_potential/2d_curved_channel/exact/q_exact_h0.0015.npz"

[split]
ood_from = 0.85
block = 0.05
val_blocks = [1, 5]
test_blocks = [3, 7]

[features]
library = ["y", "x", "u", "v", "y^2", "x^2", "y*x", "u^2", "v^2", "y^3", "x^3", "y^2*x", "y*x^2"]
top_k = [2, 4]

[train]
lags = [1, 2, 4, 8]
anchor_stride = 2
mid_weight = 5.0

[m1]
l1_C = [0.01, 0.1, 1.0, 10.0]
gam_knots = 12
gam_ridge = [1e-3, 1e-1, 10.0]         # P-spline penalty on second differences of the coefficients
max_frames = 400000

[m2]
max_frames = 400000
max_iter = 300

[m3]
archs = [[32], [64, 64], [128, 128, 128]]
betas = [0.0, 0.1, 1.0, 10.0]
epochs = 24
checkpoints = 8
batch = 4096
lr = 3e-3
weight_decay = 1e-4
max_anchors = 3000000

[m3.lean]                           # `run.py fit cc_br --lean`: the short sweep (the full one above is the reference)
archs = [[64, 64], [128, 128, 128]]
betas = [0.0, 10.0]
sets = ["cvs"]

[eval]
q_lo = 1e-4
q_hi = 0.95
n_interfaces = 12
slab_half_logit = 0.2                # slab |logit m - logit q_k| < 0.2 (same width at every level)
zq_lags = [1, 4, 16, 64, 256, 1024, 4096]
select_lags = [1, 4, 16, 64, 256]
max_pieces_select = 4000

[export]
ramp = 0.05
scale_eps = 1e-3
ood_quantile = 0.999
