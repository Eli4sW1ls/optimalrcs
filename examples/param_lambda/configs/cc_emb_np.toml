# Embedding test, end to end: as cc_emb, with q_np from an NPNEq fit on all 31 embedded CVs
# (run.py fit-qnp-embedded cc_emb_np, then run.py embed cc_emb_np).
inherit = "cc_emb"
name = "cc_emb_np"

[embed]
labels = "examples/figures_by_potential/2d_curved_channel/brownian_g10/param_lambda/cc_emb_np/qnp/committor.npz"
qnp_fit_args = ["--max-iter", "40000", "--lazy-basis", "--gamma", "0.1", "--print-step", "2000"]
