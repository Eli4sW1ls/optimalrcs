# Full loop on the Brownian Z with the dp placement (crossing probability ~target_p per pair, then even shooting
# regions, n_sh = 2) in every pass and the freeze; pauses after every pass (and pass 0) for the interface figure:
#     python -m loop.confirm loop_z_dp continue|stop|status
inherit = "loop_z"
name = "loop_z_dp"

[run]
confirm_passes = true
pass_figures = true

[student]
holdout_resid = 1.0                 # variant C: hold out frames whose label deviates > 1.0 logit from the local label field
                                    # (24-27% of frames; offline 2026-11-26: bend near A 0.31 -> 0.13, RMSE 0.282 -> 0.256)

[interfaces]
method = "dp"
target_p = 0.3
long_ratio = 2.0
split_gain = 0.15                   # evening split must shorten the region by 15% (basin: each split gains 15-30%, together ~6x)
n_sh = 2
balance = true                      # after the dp and the evening step: move interfaces to even out the shooting-region frames
p_max = 0.9                         # balance: no move makes a pair crossed with p above this (unless it already was)
balance_p_weight = 0.3              # balance objective: sum (ln frames - mean)^2 + this x sum (ln(p / target_p))^2 over all pairs
place_margin = 1.5                  # placement limits 1.5x stricter than the gate (eps 1% -> 0.67% on the pool)
levels = "measured"                 # committor levels re-mapped to the measured crossing probabilities of the last run
levels_run = "production_refill"    # freeze round 1: calibrate on this run (same frozen lambda, 20 000 cycles)
merge_p_min = 0.2                  # evening step: merge two pairs only if the merged pair keeps p >= this (default target_p / 3)
balance_p_min = 0.2                 # balance: no move pushes a pair below this p (default merge_p_min)
