# 3D Z potential with a coupled slow coordinate w (toytis potentials/zpot_w.ZChannelsW, dV_w = 3 kT): two mirrored
# Z channels selected by w; the committor depends on w between the two ridges. Staple run made by
# toytis notebooks/zpot_w_run.py --seed 1 (settings as sim_istarz_br_g10, dim 3). Prepared before the run exists:
# `run.py fit-qnp zw_br`, then `extract`, `screen`, `fit`, `evaluate` as for z_br. No exact committor yet (3D grid
# solve still to do; zpotw_gpu.py shoot gives point checks), so the spread is measured against q_np only.
name = "zw_br"
seed = 0

[data]
tis_dir = "../toytis/simulations/sim_istarzw_br_g10_dV3_s1"
loader_args = ["--reversed", "--paths-per-ensemble", "1500"]
q_np = "examples/figures_by_potential/3d_zpot_w/brownian_g10/staple/param_lambda/zw_br/qnp/committor.npz"
qnp_fit_args = ["--max-iter", "30000", "--lazy-basis", "--gamma", "0.1"]   # as many iterations as the Z fit; to check
cv_names = ["y", "x", "w"]
state_cv = 0

[split]
id_from = 0.4                       # paths of earlier cycles are not used (the old loader had no burn-in)
ood_from = 0.85                     # cycles >= 0.85 * n_cycles: the later sampling block (OOD test)
block = 0.05                        # contiguous blocks of 5% of the cycles between burn-in and ood_from
val_blocks = [1, 5]                 # checkpoint / model selection
test_blocks = [3, 7]                # reported (in-distribution test)

[features]
# Monomials of linear forms of the CVs (see lambda_runtime.Features): u = (y + x)/sqrt2, v = (y - x)/sqrt2
library = ["y", "x", "w", "u", "v", "y^2", "x^2", "w^2", "y*x", "x*w", "y*w", "u*w", "v*w", "u^2", "v^2", "y^3", "x^3", "y^2*x", "y*x^2"]
top_k = [3, 5]

[features.sets.yx]                  # reference: lambda from y and x only (w left out). Its runs form the families
exclude = ["w"]                     # M3-yx, M1-logit-yx, M1-gam-yx: evaluated and reported, never selected
reference = true

[train]
lags = [1, 2, 4, 8]
anchor_stride = 4                   # every 4th valid training frame is an anchor of the pointwise loss
mid_weight = 5.0                    # weight factor for 0.05 < q_np < 0.95

[m1]
l1_C = [0.01, 0.1, 1.0, 10.0]
gam_knots = 12
gam_ridge = [1e-3, 1e-1, 10.0]         # P-spline penalty on second differences of the coefficients
max_frames = 400000

[m2]
max_frames = 400000
max_iter = 300

[m3]
archs = [[32], [64, 64], [128, 128, 128]]
betas = [0.0, 0.1, 1.0, 10.0]
epochs = 24
checkpoints = 8
batch = 4096
lr = 3e-3
weight_decay = 1e-4
max_anchors = 3000000

[m3.lean]                           # `run.py fit z_br --lean`: the short sweep (the full one above is the reference)
archs = [[64, 64], [128, 128, 128]]
betas = [0.0, 10.0]
sets = ["cvs", "yx"]

[eval]
q_lo = 1e-4                         # planned interfaces: n levels equally spaced in ln q on [q_lo, q_hi]
q_hi = 0.95
n_interfaces = 12
slab_half_logit = 0.2                # slab |logit m - logit q_k| < 0.2 (same width at every level)
zq_lags = [1, 4, 16, 64, 256, 1024, 4096]
select_lags = [1, 4, 16, 64, 256]   # lags of the checkpoint-selection metric (validation paths)
max_pieces_select = 4000            # validation pieces used for checkpoint selection

[export]
ramp = 0.05                         # A/B ramp width, as a fraction of lambda_B - lambda_A (not tied to interfaces)
scale_eps = 1e-3                    # output scale s(p) = log1p(p/eps)/log1p(1/eps)
ood_quantile = 0.999
